{% extends "base.html" %}{% block content %}<h1>HR Job Postings</h1><p><a class="btn btn-primary" href="{% url 'hr:job_create' %}">Create Job</a></p><table class="table"><tr><th>Title</th><th>Department</th><th>Status</th><th></th></tr>{% for job in jobs %}<tr><td>{{ job.title }}</td><td>{{ job.department }}</td><td>{{ job.status }}</td><td><a href="{% url 'hr:job_detail' job.pk %}">Open</a></td></tr>{% empty %}<tr><td colspan="4">No jobs yet.</td></tr>{% endfor %}</table>{% endblock %}
