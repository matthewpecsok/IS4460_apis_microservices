{% extends "base.html" %}{% block content %}<h1>Candidate Applications</h1><table class="table"><tr><th>Candidate</th><th>Job</th><th>Status</th><th></th></tr>{% for app in applications %}<tr><td>{{ app.candidate_name }}</td><td>{{ app.job.title }}</td><td>{{ app.status }}</td><td><a href="{% url 'hr:application_detail' app.pk %}">Review</a></td></tr>{% empty %}<tr><td colspan="4">No applications yet.</td></tr>{% endfor %}</table>{% endblock %}
