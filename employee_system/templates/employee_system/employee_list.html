{% extends "base.html" %}{% block content %}<h1>Employee Profiles</h1><table class="table"><tr><th>Name</th><th>Email</th><th>Department</th><th>Status</th></tr>{% for e in employees %}<tr><td><a href="{% url 'employee_system:employee_detail' e.pk %}">{{ e.first_name }} {{ e.last_name }}</a></td><td>{{ e.email }}</td><td>{{ e.department }}</td><td>{{ e.status }}</td></tr>{% empty %}<tr><td colspan="4">No employees yet.</td></tr>{% endfor %}</table>{% endblock %}
